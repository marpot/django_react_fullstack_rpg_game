name: django_rpg_dev

services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-django_rpg}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - django_rpg_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    restart: unless-stopped
    networks:
      - backend_net

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - backend_net

  backend:
    build:
      context: ./backend
    env_file:
      - path: .env.docker
        required: false
    environment:
      DEBUG: "True"
      POSTGRES_DB: ${POSTGRES_DB:-django_rpg}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOW_ALL_ORIGINS: "True"
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    command: /app/entrypoints/web.sh
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - backend_net

  celery:
    build:
      context: ./backend
    env_file:
      - path: .env.docker
        required: false
    environment:
      DEBUG: "True"
      POSTGRES_DB: ${POSTGRES_DB:-django_rpg}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOW_ALL_ORIGINS: "True"
    command: /app/entrypoints/worker.sh
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpus: 0.25
    mem_limit: 256m
    restart: unless-stopped
    profiles: [full]
    networks:
      - backend_net

  celery-beat:
    build:
      context: ./backend
    env_file:
      - path: .env.docker
        required: false
    environment:
      DEBUG: "True"
      POSTGRES_DB: ${POSTGRES_DB:-django_rpg}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOW_ALL_ORIGINS: "True"
    command: /app/entrypoints/beat.sh
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpus: 0.25
    mem_limit: 256m
    restart: unless-stopped
    profiles: [full]
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge

volumes:
  django_rpg_db_data:
    name: django_rpg_db_data
