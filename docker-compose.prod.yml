name: django_rpg_prod

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - rpg_network

  backend:
    build:
      context: ./backend
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-}
      POSTGRES_DB: ${POSTGRES_DB:-django_rpg}
      POSTGRES_USER: ${POSTGRES_USER:-django_rpg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
      CORS_ALLOW_ALL_ORIGINS: "False"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_BASE_URL: ${GROQ_API_BASE_URL:-https://api.groq.com/openai/v1}
    expose:
      - "8000"
    command:
      - /bin/sh
      - -c
      - ': "$${SECRET_KEY:?SECRET_KEY is required}"; : "$${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"; exec /app/entrypoints/web.sh'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - rpg_network

  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-django_rpg}
      POSTGRES_USER: ${POSTGRES_USER:-django_rpg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - django_rpg_prod_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - rpg_network

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - rpg_network

networks:
  rpg_network:
    driver: bridge

volumes:
  django_rpg_prod_db_data:
    name: django_rpg_prod_db_data
